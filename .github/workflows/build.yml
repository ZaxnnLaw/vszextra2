name: build-vsze-extras

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', '**.txt']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: MC ${{ matrix.mc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # satu versi merah tidak membatalkan versi lain
      matrix:
        include:
          # loom/gradle dipilih sesuai versi Minecraft
          - { mc: '1.21',    loom: '1.7-SNAPSHOT',  gradle: '8.10.2' }
          - { mc: '1.21.1',  loom: '1.7-SNAPSHOT',  gradle: '8.10.2' }
          - { mc: '1.21.2',  loom: '1.8-SNAPSHOT',  gradle: '8.10.2' }
          - { mc: '1.21.3',  loom: '1.8-SNAPSHOT',  gradle: '8.10.2' }
          - { mc: '1.21.4',  loom: '1.9-SNAPSHOT',  gradle: '8.12' }
          - { mc: '1.21.5',  loom: '1.10-SNAPSHOT', gradle: '8.12' }
          - { mc: '1.21.6',  loom: '1.10-SNAPSHOT', gradle: '8.12' }
          - { mc: '1.21.7',  loom: '1.10-SNAPSHOT', gradle: '8.12' }
          - { mc: '1.21.8',  loom: '1.10-SNAPSHOT', gradle: '8.12' }
          - { mc: '1.21.9',  loom: '1.14-SNAPSHOT', gradle: '9.2.0' }
          - { mc: '1.21.10', loom: '1.14-SNAPSHOT', gradle: '9.2.0' }
          - { mc: '1.21.11', loom: '1.14-SNAPSHOT', gradle: '9.2.0' }

    steps:
      - uses: actions/checkout@v4

      - name: Cek source ada di repo
        run: |
          echo "== isi repo =="; ls -la
          echo "== file di src/ =="; find src -type f 2>/dev/null | sort | head -n 80 || true
          N=$(find src -type f -name '*.java' 2>/dev/null | wc -l)
          echo "jumlah file .java: $N"
          if [ "$N" -eq 0 ]; then
            echo "::error::Tidak ada file .java di src/. Folder src/ belum ter-upload ke repo (harus ada src/main/java, src/v1, src/v2, src/v3, src/v4)."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}

      - name: Cari versi yarn, loader, dan Fabric API
        id: ver
        run: |
          set -euo pipefail
          MC='${{ matrix.mc }}'

          YARN=$(curl -fsSL "https://meta.fabricmc.net/v2/versions/yarn/$MC" | jq -r '.[0].version')
          LOADER=$(curl -fsSL "https://meta.fabricmc.net/v2/versions/loader" | jq -r '[.[] | select(.stable)][0].version')
          FAPI=$(curl -fsSL -G "https://api.modrinth.com/v2/project/fabric-api/version" \
                   -A "vsze-extras-ci" \
                   --data-urlencode "game_versions=[\"$MC\"]" \
                   --data-urlencode 'loaders=["fabric"]' \
                 | jq -r '[.[] | select(.version_type == "release")][0].version_number')

          for v in "$YARN" "$LOADER" "$FAPI"; do
            if [ -z "$v" ] || [ "$v" = "null" ]; then echo "::error::Versi dependensi tidak ditemukan untuk $MC"; exit 1; fi
          done

          echo "yarn=$YARN"     >> "$GITHUB_OUTPUT"
          echo "loader=$LOADER" >> "$GITHUB_OUTPUT"
          echo "fapi=$FAPI"     >> "$GITHUB_OUTPUT"
          echo "MC=$MC yarn=$YARN loader=$LOADER fabric-api=$FAPI loom=${{ matrix.loom }}"

      - name: Build
        run: |
          gradle build --no-daemon --stacktrace \
            -Pminecraft_version='${{ matrix.mc }}' \
            -Pyarn_mappings='${{ steps.ver.outputs.yarn }}' \
            -Ploader_version='${{ steps.ver.outputs.loader }}' \
            -Pfabric_version='${{ steps.ver.outputs.fapi }}' \
            -Ploom_version='${{ matrix.loom }}' \
            -Pmod_version='1.0.${{ github.run_number }}'

      - name: Cek hasil build
        run: |
          set -euo pipefail
          echo "== build/libs =="; ls -l build/libs
          JAR=$(ls build/libs/*.jar | grep -v -e '-sources' -e '-dev' | head -n1)
          echo "== Jar dipakai: $JAR =="
          unzip -l "$JAR" | tail -n 40
          SIZE=$(stat -c%s "$JAR")
          CLASSES=$(unzip -l "$JAR" | grep -c '\.class$' || true)
          echo "ukuran=$SIZE byte, class=$CLASSES"
          unzip -l "$JAR" | grep -q 'fabric.mod.json' || { echo "::error::fabric.mod.json tidak ada di jar"; exit 1; }
          [ "$CLASSES" -gt 0 ] || { echo "::error::Jar tidak berisi class (source tidak ikut dikompilasi)"; exit 1; }
          [ "$SIZE" -gt 500000 ] || { echo "::error::Jar terlalu kecil ($SIZE byte), resource tidak ikut"; exit 1; }

      - name: Ganti nama jar (vsze-extras-<versi>.jar)
        run: |
          set -euo pipefail
          mkdir -p out
          JAR=$(ls build/libs/*.jar | grep -v -e '-sources' -e '-dev' | head -n1)
          cp "$JAR" "out/vsze-extras-${{ matrix.mc }}.jar"
          # file kecil yang dicek launcher untuk tahu ada update atau tidak
          echo '{"version":"1.0.${{ github.run_number }}"}' > "out/vsze-extras-${{ matrix.mc }}.json"
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: vsze-extras-${{ matrix.mc }}
          path: out/vsze-extras-${{ matrix.mc }}.*
          if-no-files-found: error

  # Otomatis: semua jar yang berhasil dibuild dipublish ke Release dengan tag "extras" (ditimpa tiap build).
  # Launcher mengambil dari https://github.com/<user>/<repo>/releases/download/extras/vsze-extras-<versi>.jar
  publish:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: vsze-extras-*
          path: dist
          merge-multiple: true

      - name: Publish ke Release "extras"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ls -l dist
          if ! ls dist/*.jar >/dev/null 2>&1; then echo "::error::Tidak ada jar untuk dipublish"; exit 1; fi
          gh release view extras >/dev/null 2>&1 || gh release create extras \
            --target "${{ github.sha }}" --title "VSZE Extras (terbaru)" \
            --notes "Jar terbaru vsze-extras. Ditimpa otomatis tiap build; diambil oleh launcher."
          # jar dulu, json terakhir: launcher baru melihat versi baru setelah jar-nya siap
          gh release upload extras dist/*.jar --clobber
          gh release upload extras dist/*.json --clobber
